root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_CFLAGS=\"-I$(pwd)/include\" go build -o ./tmp/wallet ./cmd/wallet"
  entrypoint = ["tmp/wallet"]
  full_bin = "CGO_CFLAGS=\"-I$(pwd)/include\" ./tmp/wallet"
  include_ext = ["go"]
  exclude_dir = ["bin", "dist", "tmp", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"
  log = "build-errors.log"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
